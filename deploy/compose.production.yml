services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_URL: https://${APP_DOMAIN}
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: /api
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: https://${APP_DOMAIN}
      CLIENT_URL: https://${APP_DOMAIN}
      ADMIN_URL: https://${ADMIN_DOMAIN}
      ALLOWED_ORIGINS: https://${APP_DOMAIN},https://${ADMIN_DOMAIN}

volumes:
  caddy_data:
  caddy_config:
