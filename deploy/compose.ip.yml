services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_URL: http://${SERVER_IP}
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: /api
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.ip
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: http://${SERVER_IP}
      CLIENT_URL: http://${SERVER_IP}
      ADMIN_URL: http://${SERVER_IP}:8080
      ALLOWED_ORIGINS: http://${SERVER_IP},http://${SERVER_IP}:8080
