services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_URL: https://${SITE_DOMAIN}
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: /api
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.ip
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: https://${SITE_DOMAIN}
      CLIENT_URL: https://${SITE_DOMAIN}
      ADMIN_URL: https://${SITE_DOMAIN}/admin
      ALLOWED_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}

volumes:
  caddy_data:
  caddy_config:
